name: astroedu
description: AstroEdu - Aplikasi Belajar Astronomi
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Database
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.2
  
  # Auth biometric
  local_auth: ^2.1.8
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.1.0
  
  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  
  # Sensor
  sensors_plus: ^7.0.0
  
  # Image picker
  image_picker: ^1.0.7
  
  # Notifications
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  
  # Crypto (AES encryption)
  encrypt: ^5.0.3
  crypto: ^3.0.3
  
  # UI extras
  cached_network_image: ^3.3.1
  flutter_markdown: ^0.6.22
  lottie: ^3.1.0
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  
  # Icons
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.7.0
  
  # Google Generative AI (Gemini)
  google_generative_ai: ^0.4.3
  
  # Intl
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/